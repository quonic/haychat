    wave: 1
    agent: gem-debugger
    status: completed
    covers:
      - Reducer branches that currently fake send success
      - Explicit runtime owner for post-auth send and receive work
      - Existing transport helpers that can be reused for encrypted app-packet IO
      - Minimal inbound metadata required for authoritative room-chat append
      - DM and failed-send behavior under the current server contract
    dependencies: []
    conflicts_with: []
    context_files:
      - path: client/update.odin
        description: Contains optimistic SendChatMessage and SendChannelChatMessage append logic plus placeholder receive branches.
      - path: client/main.odin
        description: Owns startup auth lifecycle, selected transport state, and any runtime hook candidate.
      - path: client/transport.odin
        description: Owns ENet session state, encrypted packet sealing, and packet opening.
      - path: client/view.odin
        description: Emits reducer messages for DM and channel input submission.
      - path: common/protocol.odin
        description: Defines ClientChatMessagePayload and ServerChatMessagePayload.
    flags:
      flaky: false
      retries_used: 0
      requires_design_validation: false
    acceptance_criteria:
      - Add an explicit first-class task for steady-state ENet poll and dispatch ownership.
      - Add or adjust the state or reducer seam so inbound messages carry enough metadata for authoritative rendering.
      - Keep unsupported DM path from faking success.
    success_criteria:
      - Names the exact function or hook where post-auth ENet polling and dispatch should live.
      - Names the smallest outbound send trigger that should replace optimistic local append.
      - Names the exact metadata fields required for server, room, and self-versus-other gating.
      - Confirms whether unsupported or failed send should reuse an existing error surface or add one narrow chat-specific status field.
      - Produces a minimal file list for implementation without expanding beyond the client/runtime slice.

  - id: T2-implement-steady-state-chat-runtime-owner
    title: Implement steady-state ENet poll and dispatch ownership for chat
    description: Reuse the established encrypted transport to add one explicit post-auth runtime owner that services ENet, emits encrypted ClientChatMessage packets for the selected server and room, and translates inbound ServerChatMessage or protocol-error packets into app-level events.
    wave: 2
    agent: gem-implementer
    status: completed
    covers:
      - First-class post-auth ENet service hook
      - Client-side encrypted room-chat send helper
      - Inbound packet decode and translation into reducer-consumable events
      - Narrow error handling for unsupported or failed chat delivery
    dependencies:
      - T1-debug-client-chat-runtime-gap
    conflicts_with: []
    context_files:
      - path: client/transport.odin
        description: Existing encrypted packet seal/open helpers and live ENet session state.
      - path: client/main.odin
        description: Runtime owner for selected transport state and startup auth lifecycle.
      - path: common/protocol.odin
        description: Shared room-chat payload definitions and message types.
    flags:
      flaky: false
      retries_used: 0
      requires_design_validation: false
    debugger_diagnosis:
      root_cause: The client UI only emits reducer messages, update.odin fakes successful send by mutating visible chat state directly, and client/transport.odin stops at generic encrypted packet build/open helpers without an explicit app-level post-auth send or poll owner.
      target_files:
        - client/transport.odin
        - client/main.odin
        - common/protocol.odin
      fix_recommendations: Add the smallest established-session helper set needed to seal ClientChatMessagePayload, service ENet for inbound packets after auth, decode ServerChatMessagePayload or ServerProtocolError, and translate those results into structured reducer events without altering startup auth flow.
      injected_at: 2026-07-02T10:22:52-05:00
    acceptance_criteria:
      - Add an explicit first-class task for steady-state ENet poll and dispatch ownership.
      - Real server-backed room chat remains the source of truth.
      - Failure paths stay narrow and do not fake visible delivery.
    success_criteria:
      - A selected established transport can emit encrypted ClientChatMessage packets using the existing protocol types.
      - Normal runtime execution has one defined path that services ENet receive events after auth and surfaces structured app-level chat or error events.
      - The implementation exposes enough inbound event data for downstream server, room, and sender gating.
      - Protocol errors or disconnected transport states fail narrowly without silently appending chat.
      - Startup auth behavior from HC-103 remains unchanged.
    tech_stack:
      - Odin
      - ENet
      - shared:skald commands/runtime callbacks
      - Shared CBOR packet protocol
    test_coverage: Add focused client tests around the runtime dispatch seam or transport helpers only as needed to lock the ownership contract.
    diag:
      paired_debugger_task: T1-debug-client-chat-runtime-gap
      likely_send_surface: ClientServerTransport_buildEncryptedPacketBytes
      likely_receive_surface: ClientServerTransport_handleIncomingPacket plus a new narrow ENet service helper
      room_contract: Use the HC-104 shared room contract and existing ClientChatMessagePayload or ServerChatMessagePayload.
    handoff:
      do_not_reinvestigate:
        - client/main.odin already owns selected-server startup auth and should remain the lifecycle owner.
        - client/transport.odin already knows how to open EncryptedPacket and seal outbound encrypted packets once auth is established.
        - common/protocol.odin already contains room-chat payload structs, so new protocol types should not be introduced unless strictly required.
      required_test_first: odin check client -target:linux_amd64
      target_files:
        - client/transport.odin
        - client/main.odin
        - common/protocol.odin
      minimal_change: Add only the helper and runtime glue needed for post-auth room-chat send and receive ownership; do not redesign startup auth or global app architecture.
      acceptance_checks:
        - odin check client -target:linux_amd64
        - odin test client

