plan_id: 20260702-hc-105-real-chat-send-receive
objective: "Revise HC-105 so implementation explicitly adds steady-state client chat transport ownership, authoritative inbound metadata, and focused no-fake-success coverage."
created_at: 2026-07-02T10:22:52-05:00
created_by: gem-planner
status: completed
tldr: |
  Revise HC-105 around the critique findings instead of treating them as implicit implementation detail.
  The first implementation wave after diagnosis now owns steady-state post-auth ENet polling and dispatch as a
  first-class slice. A follow-on implementation wave updates the state or reducer seam so inbound room chat carries
  enough source metadata to gate by selected server and room, distinguish self from other senders, stop optimistic
  local append on submit, and cover unsupported or failed send paths with focused tests.

plan_metrics:
  wave_1_task_count: 1
  total_dependencies: 3
  risk_score: medium

quality_warnings:
  - The original HC-105 plan buried steady-state ENet ownership inside a broader transport task; that ownership gap is now an explicit implementation slice because receive behavior cannot be authoritative without it.
  - Current client chat state appears too shallow for selected-server, room, and self-versus-other gating, so the metadata carrier must be identified before reducer changes are implemented.
  - DM compose UI remains in scope only as an unsupported path that must stop faking success; do not invent a new backend DM protocol.

reviewer_focus:
  - Confirm the first executable wave after diagnosis is the steady-state ENet owner and not reducer cleanup.
  - Confirm send actions no longer mutate visible chat history before a server echo or broadcast is received.
  - Confirm inbound events carry enough metadata to reject stale or off-context messages and to render self versus other senders distinctly.
  - Confirm unsupported or failed send paths remain narrow and do not destabilize startup auth or widen protocol scope.

prd_update_recommended: false

suggested_plan_files:
  - docs/plan/20260702-hc-105-real-chat-send-receive/plan.yaml
  - docs/plan/20260702-hc-105-real-chat-send-receive/context_envelope.json

resolved_decisions:
  - decision: Steady-state post-auth ENet polling and dispatch is a first-class HC-105 task, not hidden glue.
    context: Real server-backed room chat cannot become authoritative until one explicit runtime owner services ENet after startup auth and converts inbound packets into reducer-consumable events.
    affects:
      - T1-debug-client-chat-runtime-gap
      - T2-implement-steady-state-chat-runtime-owner
      - T4-critic-validate-hc-105-slice
  - decision: Shared room chat echoed from the server is the only source of truth for visible channel history.
    context: Submit actions may trigger transport work, but visible success must come from received ServerChatMessage handling rather than optimistic local append.
    affects:
      - T2-implement-steady-state-chat-runtime-owner
      - T3-implement-authoritative-chat-state-and-tests
      - T4-critic-validate-hc-105-slice
  - decision: Inbound room-chat events must carry enough metadata to gate by selected server and room and distinguish self versus other senders.
    context: The current reducer seam is too ambiguous for authoritative receive behavior unless the implementation names a minimal metadata carrier before rendering changes.
    affects:
      - T1-debug-client-chat-runtime-gap
      - T3-implement-authoritative-chat-state-and-tests
      - T4-critic-validate-hc-105-slice
  - decision: Unsupported DM send must stop faking success without adding new backend protocol.
    context: The DM UI may remain visible, but HC-105 should no-op or surface a narrow failure state instead of appending local fake success.
    affects:
      - T1-debug-client-chat-runtime-gap
      - T3-implement-authoritative-chat-state-and-tests
      - T4-critic-validate-hc-105-slice

open_questions:
  - question: What is the smallest inbound event shape that can represent transport source, room identity, and self-versus-other sender state without widening protocol scope?
    context: The critique identifies missing metadata as blocking, but the exact carrier may be a new reducer payload, a small state struct, or a translation layer from transport helpers.
    type: research
    affects:
      - T1-debug-client-chat-runtime-gap
      - T3-implement-authoritative-chat-state-and-tests
  - question: Should unsupported or failed send reuse an existing error surface in client state or add one narrow chat-specific status field?
    context: HC-105 needs failure-path UX coverage, but the plan should prefer the smallest existing error surface that preserves clarity.
    type: decision_blocker
    affects:
      - T1-debug-client-chat-runtime-gap
      - T3-implement-authoritative-chat-state-and-tests

pre_mortem:
  overall_risk_level: medium
  critical_failure_modes:
    - scenario: Receive decoding exists, but no steady-state owner ever services ENet after auth, so inbound server chat never reaches the reducer during normal runtime.
      likelihood: medium
      impact: high
      mitigation: Make runtime ownership its own implementation task, diagnose the exact hook first, and require focused validation on the chosen poll or dispatch seam.
    - scenario: Reducer changes remove optimistic append but still cannot tell selected server, room, or self-versus-other context, so inbound messages render incorrectly or leak across contexts.
      likelihood: medium
      impact: high
      mitigation: Lock a minimal metadata contract in diagnosis, then implement state or reducer changes only after the runtime owner task exposes that contract.
    - scenario: Unsupported or failed sends no longer append locally but also provide no narrow status feedback, leaving the UI looking broken.
      likelihood: medium
      impact: medium
      mitigation: Reuse an existing error surface when possible and require focused tests for unsupported DM send and failed room send behavior.
    - scenario: New app-packet helpers mutate transport session state incorrectly and break subsequent encrypted traffic.
      likelihood: low
      impact: critical
      mitigation: Reuse ClientServerTransport_buildEncryptedPacketBytes and ClientServerTransport_handleIncomingPacket patterns instead of introducing parallel crypto handling.
  assumptions:
    - Startup auth ownership from HC-103 remains in client/main.odin and should not be reworked.
    - HC-104 server routing already accepts ClientChatMessage and emits ServerChatMessage for the shared room contract.
    - The minimum acceptable scope is room chat only; DM send is unsupported for this slice.
    - Narrow validation consists of client-focused Odin checks and tests rather than full end-to-end multi-process chat automation.

