plan_id: 20260702-hc-104-server-chat-dispatch
objective: Implement HC-104 server-side dispatch for MVP chat packets.
created_at: 2026-07-02T09:54:21-05:00
created_by: gem-planner
status: completed
tldr: |
  HC-104 is implemented and validated: the authenticated application-packet router
  accepts ClientChatMessage, enforces the MVP shared room contract (roomId = 1),
  broadcasts an encrypted ServerChatMessage to every authenticated peer including
  the sender, and returns an encrypted ServerProtocolError for unsupported roomId
  values.

plan_metrics:
  wave_1_task_count: 1
  total_dependencies: 4
  risk_score: medium

quality_warnings:
  - Current router test harness only seeds peer 1; broadcast coverage likely needs a small multi-peer harness extension.
  - Chat payload shape must be chosen carefully to avoid expanding scope into room membership, persistence, or presence tracking.

reviewer_focus:
  - Preserve encrypted transport semantics for authenticated peers during broadcast fan-out.
  - Confirm per-peer transport state is written back after each sealed outbound chat packet.
  - Keep unsupported-room handling narrow and consistent with existing router error patterns.

prd_update_recommended: false

suggested_plan_files:
  - docs/plan/20260702-hc-104-server-chat-dispatch/plan.yaml
  - docs/plan/20260702-hc-104-server-chat-dispatch/context_envelope.json

resolved_decisions:
  - decision: Use an asymmetric MVP chat payload contract.
    context: ClientChatMessage should use a minimal client-owned payload, while ServerChatMessage may reuse or mirror the richer server-owned message shape.
    affects:
      - T2-implement-chat-dispatch
      - T3-add-router-chat-tests
  - decision: Unsupported MVP room IDs must return encrypted ServerProtocolError.
    context: This matches the existing router error surface and avoids inventing a new validation contract for HC-104.
    affects:
      - T2-implement-chat-dispatch
      - T3-add-router-chat-tests

pre_mortem:
  overall_risk_level: medium
  critical_failure_modes:
    - scenario: Broadcast logic seals one outbound packet but fails to persist updated transport state per recipient, causing later encrypted traffic or tests to fail.
      likelihood: medium
      impact: high
      mitigation: Route all chat fan-out through MainRouterState_sendPeerMessage and explicitly verify sender and recipient can decrypt their own queued packets in router tests.
    - scenario: Chat handling accidentally widens scope into room membership or presence state.
      likelihood: low
      impact: medium
      mitigation: Limit validation to roomId == 1 and authenticated peers only; avoid adding room maps or membership bookkeeping.
    - scenario: Multi-peer router tests become brittle because the current harness and IPC polling helpers assume a single connected peer.
      likelihood: medium
      impact: medium
      mitigation: Add the smallest harness helper needed to register a second peer and consume two queued encrypted sends deterministically.
  assumptions:
    - MVP uses one shared room with roomId = 1.
    - Authenticated sender receives their own broadcast.
    - Chat dispatch remains stateless at the router layer and does not persist messages.
    - Existing auth and encrypted transport helpers remain authoritative and unchanged.

