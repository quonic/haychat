    conflicts_with: []
    context_files:
      - path: client/main_test.odin
        description: Explicitly chosen home for the live MVP proof and any tiny local helpers.
      - path: client/transport.odin
        description: Owns the send and runtime polling helpers the live proof must reuse.
      - path: client/main.odin
        description: Startup auth bridge ownership and selected transport startup behavior remain relevant context.
      - path: common/auth_test.odin
        description: Existing crypto/auth baselines remain baseline coverage rather than being duplicated in the live proof.
    flags:
      flaky: false
      retries_used: 0
      requires_design_validation: false
    acceptance_criteria:
      - Keep scope to automated startup/auth/one-message MVP coverage.
      - Prefer focused headless harnesses over GUI or broad infrastructure work.
      - Failures must map cleanly to startup, connect, auth, or message exchange.
    success_criteria:
      - client/main_test.odin contains one environment-gated live proof for two authenticated clients and one room-chat round trip.
      - The implementation reuses existing transport send/service helpers instead of inventing a second transport surface.
