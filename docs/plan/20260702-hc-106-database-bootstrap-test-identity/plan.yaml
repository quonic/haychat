plan_id: 20260702-hc-106-database-bootstrap-test-identity
objective: "Implement HC-106 by adding database bootstrap and test identity support for the MVP flow in haychat."
created_at: 2026-07-02T11:05:00-05:00
created_by: gem-planner
status: completed
tldr: |
  Add one explicit, idempotent bootstrap path for the minimum database state required by the
  existing nickname-based auth lookup, then expose seeded test identities through the current
  local server helper so testers can authenticate without manual SQL. Keep scope tight: no
  broader auth redesign, no startup preflight work, and no changes to server identity persistence.

plan_metrics:
  wave_1_task_count: 1
  total_dependencies: 3
  risk_score: medium

quality_warnings:
  - There is no checked-in schema, seed asset, or bootstrap command today, so file placement and invocation path must be made explicit in the first execution wave.
  - Current auth behavior only proves nickname-to-user-ID lookup; adding schema or seed fields beyond that contract would widen scope without evidence.
  - Automatic bootstrap on every normal startup would increase blast radius; prefer an explicit or tightly gated path unless diagnosis proves startup ownership is already the intended seam.

reviewer_focus:
  - Confirm the bootstrap path is idempotent and can initialize a fresh local database without manual SQL.
  - Confirm seeded identities satisfy the existing auth lookup contract and do not require undocumented extra user state.
  - Confirm run-test-server or equivalent tester entrypoint exposes the supported bootstrap or seed workflow clearly.
  - Confirm validation covers both schema creation and deterministic nickname lookup for at least one seeded identity.

prd_update_recommended: false

suggested_plan_files:
  - docs/plan/20260702-hc-106-database-bootstrap-test-identity/plan.yaml
  - docs/plan/20260702-hc-106-database-bootstrap-test-identity/context_envelope.json

resolved_decisions:
  - decision: Scope bootstrap to the minimum auth data contract already enforced by the server.
    context: server/main.odin forwards ClientAuthLookup by nickname into a structured database request, and server/database.odin currently resolves only SELECT id::text FROM users WHERE nickname = $1 LIMIT 1.
    affects:
      - T1-debug-bootstrap-seam-and-required-state
      - T2-implement-database-bootstrap-and-seeds
      - T3-wire-tester-entrypoint-and-validation
  - decision: Prefer an explicit or narrowly gated bootstrap flow over unconditional startup mutation.
    context: HC-106 requires a concrete bootstrap path but HC-107 separately owns startup preflight and failure messaging, so broad startup-time schema mutation would increase blast radius beyond this issue.
    affects:
      - T1-debug-bootstrap-seam-and-required-state
      - T2-implement-database-bootstrap-and-seeds
      - T3-wire-tester-entrypoint-and-validation
  - decision: Seeded tester identities should be surfaced through the existing local helper path.
    context: run-test-server.sh is the current repository-supported local launcher, so the smallest tester-facing workflow is to extend that helper or add one adjacent helper instead of requiring ad hoc SQL.
    affects:
      - T2-implement-database-bootstrap-and-seeds
      - T3-wire-tester-entrypoint-and-validation
      - T4-document-bootstrap-and-test-identity-flow

open_questions:
  - question: Should the supported bootstrap path be an explicit environment-gated server code path, a dedicated helper command, or a shell-driven raw SQL invocation using checked-in assets?
    context: The repository has no migration framework today, and the best owning seam must be chosen for minimal blast radius.
    type: decision_blocker
    affects:
      - T1-debug-bootstrap-seam-and-required-state
      - T2-implement-database-bootstrap-and-seeds
  - question: What is the smallest checked-in schema required for a successful auth lookup in a fresh environment?
    context: Code evidence only proves the need for a users row with nickname and id, but the table definition and any constraints must be inferred from existing expectations or added minimally.
    type: research
    affects:
      - T1-debug-bootstrap-seam-and-required-state
      - T2-implement-database-bootstrap-and-seeds

pre_mortem:
  overall_risk_level: medium
  critical_failure_modes:
    - scenario: The chosen bootstrap path works only on already-initialized databases and fails on truly fresh local environments.
      likelihood: medium
      impact: high
      mitigation: Require diagnosis of the exact minimum schema and make validation include a clean-database bootstrap run.
    - scenario: Seeded identities are created, but their fields do not match the existing nickname auth contract, so testers still cannot authenticate.
      likelihood: medium
      impact: high
      mitigation: Validate using the existing structured auth lookup path or a focused database test that proves a seeded nickname resolves to a user ID.
    - scenario: Bootstrap logic is wired into ordinary startup and creates unintended runtime failures or repeated mutation.
      likelihood: medium
      impact: medium
      mitigation: Prefer an explicit or tightly gated invocation path and require idempotence checks.
    - scenario: Helper automation obscures required PostgreSQL prerequisites and gives testers a partially working flow.
      likelihood: low
      impact: medium
      mitigation: Keep helper behavior explicit, fail fast on missing database connectivity, and document the exact invocation in the final wave.
  assumptions:
    - HC-106 only needs the database state required by the current nickname-based auth lookup unless code inspection during execution proves a stricter contract.
    - Server identity persistence in storage/server_identity.json remains unchanged and out of scope.
    - Narrow validation can rely on Odin server tests plus one bootstrap or seed execution path rather than full end-to-end client automation.

