    title: Diagnose the minimal supported HC-203 workflow and command surface
    description: Confirm which current helper commands, env prerequisites, and doc steps already satisfy HC-203, identify the remaining gaps, and lock the supported scope so execution does not widen into PostgreSQL service management or unrelated reset and packaging work.
    wave: 1
    agent: gem-debugger
    status: pending
    covers:
      - Existing helper behavior in run-test-server.sh
      - Supported environment prerequisites from HC-201 and HC-202 artifacts
      - PostgreSQL lifecycle boundary for HayChat-specific usage only
      - Whether client launch needs helper automation or only explicit documented commands
      - Smallest executable validation path for startup and shutdown
    dependencies: []
    conflicts_with: []
    context_files:
      - path: run-test-server.sh
        description: Current repository-supported helper seam with bootstrap, start, background, wait, and stop commands.
      - path: README.md
        description: Current supported workflow documentation already advertises HC-203-adjacent commands and shutdown guidance.
      - path: .env.example
        description: Existing checked-in environment contract that HC-203 depends on and must not duplicate.
      - path: setup-dev-env.sh
        description: Existing HC-201 bootstrap artifact that frames PostgreSQL as a prerequisite rather than a runtime lifecycle owned by HC-203.
      - path: plans/backlog/M2-reproducible-release-candidate.md
        description: Source issue wording for HC-201, HC-202, and HC-203 acceptance boundaries.
    flags:
      flaky: false
      retries_used: 0
      requires_design_validation: false
    acceptance_criteria:
      - Team members can launch the MVP environment without reconstructing steps manually.
      - Commands match the supported workflow in the docs.
      - Scope stays on HayChat helper workflow rather than global PostgreSQL installation or service control.
    success_criteria:
      - Names the exact supported helper command set as `bootstrap`, `start`, `start-background`, `wait-ready [timeout_secs]`, `stop`, `bootstrap-start`, `bootstrap-start-background`, and `hc118-gate`.
      - States the exact client-launch stance: helper ownership stops at server lifecycle, and clients are launched explicitly with `odin run client` in separate terminals unless a direct blocker is proven.
      - States the PostgreSQL boundary clearly: availability is required, but service lifecycle is not owned here.
      - Produces a minimal implementation file list plus the exact validation sequence `cp ./.env.example ./.env && source ./.env >/dev/null 2>&1`, `./run-test-server.sh bootstrap-start-background`, readiness confirmation, explicit `odin run client`, and `./run-test-server.sh stop` without widening into HC-204 or HC-206.
    verification_checks:
      - Diagnosis output enumerates the supported helper command set exactly as `bootstrap`, `start`, `start-background`, `wait-ready [timeout_secs]`, `stop`, `bootstrap-start`, `bootstrap-start-background`, and `hc118-gate`.
      - Diagnosis output explicitly states that client launch remains manual via `odin run client` unless a blocker is proven.
      - Diagnosis output explicitly states that PostgreSQL availability is a prerequisite and that HC-203 does not own the host service lifecycle.
      - Diagnosis output includes the exact validation sequence `cp ./.env.example ./.env && source ./.env >/dev/null 2>&1`, `./run-test-server.sh bootstrap-start-background`, readiness confirmation, explicit `odin run client`, and `./run-test-server.sh stop`.

