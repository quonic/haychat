plan_id: 20260705-hc-203-start-stop-helpers
objective: "Add standard start and stop helper commands for the MVP environment per HC-203."
created_at: 2026-07-05T09:30:00Z
created_by: gem-planner
status: pending
tldr: |
  Standardize the already-emerging MVP helper seam around one documented Linux workspace flow.
  Keep run-test-server.sh as the owning lifecycle surface, consume the existing bootstrap and env
  prerequisites from HC-201, HC-202, and HC-106, and close any remaining drift between helper
  commands, startup or shutdown guidance, and executable validation. Do not take ownership of the
  system PostgreSQL service lifecycle; treat PostgreSQL availability as a prerequisite and keep the
  slice focused on the fixed helper command contract, documented .env loading, manual client launch
  guidance, and a parity check across README.md, client/AGENTS.md, server/AGENTS.md, and tester
  onboarding guidance.

plan_metrics:
  wave_1_task_count: 1
  total_dependencies: 4
  risk_score: medium

quality_warnings:
  - The repo already contains HC-203-adjacent behavior in run-test-server.sh and README.md, so the main risk is duplicating or renaming surfaces instead of standardizing them.
  - HC-203 backlog wording mentions starting PostgreSQL and one or more clients, but task clarifications narrow scope away from global PostgreSQL lifecycle control; the implementation must preserve that boundary explicitly.
  - Current helper automation is server-centric while client launch is still documented manually, so the plan must allow docs-only client guidance unless execution proves a separate client helper is required for acceptance.

open_questions: []

assumptions:
  - HC-201 is materially present through setup-dev-env.sh and the README bootstrap path, even if later polish remains possible.
  - HC-202 is materially present through .env.example and README environment guidance, so HC-203 should reuse that contract rather than invent a second configuration surface.
  - HC-106 already established the supported auth bootstrap seam through server/sql/auth_bootstrap.sql and run-test-server.sh bootstrap commands.
  - The supported MVP workflow may continue to launch clients with explicit odin run client commands if documentation and helper sequencing remove startup-order guesswork.
  - PostgreSQL is already installed and may host unrelated databases, so HC-203 must not assume start or stop ownership over the system service.

tasks:
