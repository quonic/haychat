name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux checks, tests, and live auth proof
    runs-on: ubuntu-latest
    # Fedora packages SDL3, which the client links and Ubuntu 24.04 does not provide.
    container: fedora:44
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: haychat
          POSTGRES_PASSWORD: haychat
          POSTGRES_DB: haychat
        options: >-
          --health-cmd "pg_isready -U haychat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HAYCHAT_DATABASE_URL: postgres
      HAYCHAT_DATABASE_PORT: 5432
      HAYCHAT_DATABASE_USER: haychat
      HAYCHAT_DATABASE_PASS: haychat
      HAYCHAT_DATABASE_NAME: haychat
    steps:
      - name: Install system packages
        run: >-
          dnf install -y git clang llvm llvm-devel lld libpq-devel enet-devel SDL3-devel
          libX11-devel openssl-devel which findutils procps-ng

      - uses: actions/checkout@v4

      - name: Cache Odin toolchain
        uses: actions/cache@v4
        with:
          path: /opt/Odin
          key: odin-fedora44-${{ hashFiles('.github/scripts/bootstrap-odin.sh') }}

      - name: Bootstrap Odin and shared libraries
        run: |
          .github/scripts/bootstrap-odin.sh /opt/Odin
          echo "/opt/Odin" >> "$GITHUB_PATH"

      - name: Compile checks and leak-checked tests
        run: ./check.sh

      - name: Live startup auth proof
        run: |
          ./run-test-server.sh start-background
          trap './run-test-server.sh stop' EXIT
          ./run-test-server.sh wait-ready
          HAYCHAT_LIVE_STARTUP_AUTH=1 odin test client \
            -define:ODIN_TEST_NAMES=client.testClientServerTransportCanEstablishLiveStartupAuthOverENet

      - name: Server log
        if: always()
        run: cat .haychat-test-server/server.log || true

  windows-client:
    name: Windows client compile check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Odin toolchain
        uses: actions/cache@v4
        with:
          path: C:\Odin
          key: odin-windows-${{ hashFiles('.github/scripts/bootstrap-odin.sh') }}

      - name: Bootstrap Odin and shared libraries
        shell: bash
        run: |
          # Reuse the pins from the Linux bootstrap script so both jobs build the same versions.
          eval "$(grep -E '^[A-Z_]+_COMMIT=' .github/scripts/bootstrap-odin.sh)"
          checkout_pinned() {
            if [[ ! -d "$2/.git" ]]; then
              git init -q "$2"
              git -C "$2" remote add origin "$1"
            fi
            if [[ "$(git -C "$2" rev-parse HEAD 2>/dev/null || true)" != "$3" ]]; then
              git -C "$2" fetch -q --depth 1 origin "$3"
              git -C "$2" checkout -q --force FETCH_HEAD
            fi
          }
          checkout_pinned https://github.com/odin-lang/Odin.git /c/Odin "$ODIN_COMMIT"
          checkout_pinned https://github.com/laytan/odin-postgresql.git /c/Odin/shared/pg "$PG_COMMIT"
          checkout_pinned https://github.com/laytan/odin-http.git /c/Odin/shared/odin-http \
            "$ODIN_HTTP_COMMIT"
          checkout_pinned https://github.com/BuLEEto/Skald.git /c/Skald "$SKALD_COMMIT"
          rm -rf /c/Odin/shared/skald
          cp -r /c/Skald/skald /c/Odin/shared/skald

      - name: Build Odin
        shell: cmd
        run: |
          cd /d C:\Odin
          if not exist odin.exe call build.bat release

      - name: Check client for Windows
        shell: cmd
        run: C:\Odin\odin.exe check client -target:windows_amd64
